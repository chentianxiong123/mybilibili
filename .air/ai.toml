root = "."
tmp_dir = "tmp-ai"

[build]
  bin = "./tmp-ai/main"
  cmd = "cd services/ai && go build -buildvcs=false -o ../../tmp-ai/main ./cmd/ai"
  delay = 1000
  exclude_dir = ["tmp", "tmp-core", "tmp-search", "tmp-msg-danmaku", "tmp-live", "tmp-ai", "tmp-studio", "tmp-work", "tmp-bili-proxy", "vendor", "node_modules", "old", "web", "mobile", "scripts", "deploy", "docs", "sql", ".git", "proto"]
  exclude_regex = ["_test.go$"]
  include_ext = ["go", "toml", "yaml"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
