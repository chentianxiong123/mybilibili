name: build-and-push

# 后端 8 服务 + 前端 2 应用（web/admin）镜像构建并推送 GHCR。
# wap 不做镜像（将打包为 App）。
# 触发方式: push main 自动触发（transcoder 不做容器，裸跑宿主机用系统 ffmpeg）。
# 镜像 tag: git-sha (精确回滚) + latest (默认拉取)。
# 仓库: ghcr.io/chentianxiong123/mybilibili-{core,search,msg-danmaku,live,ai,studio,work,bili,web,admin}

on:
  push:
    branches: [main]
    paths:
      - 'mybilibili-go/**'
      - 'mybilibili-front/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      services:
        description: "要构建的服务（逗号分隔，空=全部）"
        required: false
        default: "all"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/chentianxiong123/mybilibili

jobs:
  # ---------- 静态检查 + 编译（门禁，失败则不构建镜像） ----------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mybilibili-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mybilibili-go/go.work

      - name: go vet（逐模块）
        run: |
          for d in */ ; do
            [ -f "$d/go.mod" ] && (cd "$d" && echo "vet $d" && go vet ./...)
          done

      - name: go build（逐模块）
        run: |
          for d in */ ; do
            [ -f "$d/go.mod" ] && (cd "$d" && echo "build $d" && go build ./...)
          done

  # ---------- 后端 8 个服务 ----------
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: core-service,          name: core,        target: runtime}
          - {service: search-service,         name: search,      target: runtime}
          - {service: msg-danmaku-service,    name: msg-danmaku, target: runtime}
          - {service: live-service,           name: live,        target: runtime}
          - {service: ai-service,            name: ai,          target: runtime}
          - {service: studio-service,         name: studio,      target: runtime}
          - {service: work-service,          name: work,        target: runtime}
          # transcoder 不做容器（裸跑宿主机用系统 ffmpeg），不建镜像
          - {service: bili-proxy-service,    name: bili,        target: runtime}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./mybilibili-go
          file: ./mybilibili-go/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 前端 2 应用 (wap 将来打包为 App，不建镜像) ----------
  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web,    dir: mybilibili-front/apps/web,    context: mybilibili-front,  port: 3200}
          - {name: admin,  dir: mybilibili-front/apps/admin,  context: mybilibili-front,  port: 3100}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

