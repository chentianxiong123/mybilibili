name: build-and-push

# 后端 8 服务 + 前端 2 应用（web/admin）镜像构建并推送 GHCR。
# wap 不做镜像（将打包为 App）。
# 触发方式: push main 自动触发（transcoder 不做容器，裸跑宿主机用系统 ffmpeg）。
# 镜像 tag: git-sha (精确回滚) + latest (默认拉取)。
# 仓库: ghcr.io/chentianxiong123/mybilibili-{core,search,msg-danmaku,live,ai,studio,work,bili,web,admin}

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'proto/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      services:
        description: "要构建的服务（逗号分隔，空=全部）"
        required: false
        default: "all"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/chentianxiong123/mybilibili

jobs:
  # ---------- 静态检查 + 编译 + 单元测试（门禁） ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: go vet（逐模块）
        run: |
          for d in services/*/ ; do
            [ -f "$d/go.mod" ] && (cd "$d" && echo "vet $d" && go vet ./...)
          done

      - name: go build（逐模块）
        run: |
          for d in services/*/ ; do
            [ -f "$d/go.mod" ] && (cd "$d" && echo "build $d" && go build ./...)
          done

      - name: go test（逐模块）
        run: |
          for d in services/*/ ; do
            [ -f "$d/go.mod" ] && (cd "$d" && echo "test $d" && go test -count=1 ./...)
          done
          go test -count=1 ./shared/pkg/...

      - name: 覆盖率门禁（≥70%）
        run: |
          THRESHOLD=70
          FAIL=0
          for d in shared/pkg services/core services/search services/ai services/msg-danmaku services/live services/studio services/work services/bili-proxy; do
            if [ -f "$d/go.mod" ]; then
              pct=$(cd "$d" && go test -count=1 -coverprofile=/tmp/cov.out ./... 2>&1 | grep "^ok" | awk -F'coverage: ' '{print $2}' | awk -F'%' '{s+=$1; n++}END{if(n>0) printf "%.0f", s/n; else print "0"}')
              if [ "$pct" -lt "$THRESHOLD" ] 2>/dev/null; then
                echo "✗ $d: ${pct}% < ${THRESHOLD}%"
                FAIL=1
              else
                echo "✓ $d: ${pct}%"
              fi
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "✗ 覆盖率低于阈值 ${THRESHOLD}%，CI 失败"
            exit 1
          fi

  # ---------- 前端单元测试 ----------
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/user/package-lock.json
            web/admin/package-lock.json

      - name: web/user 测试
        run: |
          cd web/user
          npm ci --prefer-offline
          npx vitest run

      - name: web/admin 测试
        run: |
          cd web/admin
          npm ci --prefer-offline
          npx vitest run

  # ---------- 集成测试（需要 docker compose） ----------
  integration-test:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: 启动测试环境
        run: |
          cd tests/integration
          docker compose -f docker-compose.test.yml up -d --wait

      - name: 等待服务就绪
        run: sleep 15

      - name: 跑集成测试
        run: go test -tags=integration -count=1 -v ./tests/integration/...

      - name: 清理
        if: always()
        run: cd tests/integration && docker compose -f docker-compose.test.yml down -v

  # ---------- 后端 8 个服务 ----------
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: core,          name: core,        target: runtime}
          - {service: search,        name: search,      target: runtime}
          - {service: msg-danmaku,   name: msg-danmaku, target: runtime}
          - {service: live,          name: live,        target: runtime}
          - {service: ai,            name: ai,          target: runtime}
          - {service: studio,        name: studio,      target: runtime}
          - {service: work,          name: work,        target: runtime}
          # transcoder 不做容器（裸跑宿主机用系统 ffmpeg），不建镜像
          - {service: bili-proxy,    name: bili,        target: runtime}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 前端 2 应用 (wap 将来打包为 App，不建镜像) ----------
  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web,    context: web/user,   port: 3200}
          - {name: admin,  context: web/admin,   port: 3100}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
