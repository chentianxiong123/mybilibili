name: build-and-push

# 后端 8 服务 + 前端 2 应用（web/admin）镜像构建并推送 GHCR。
# wap 不做镜像（将打包为 App）。
# 触发方式: push main 自动触发（transcoder 不做容器，裸跑宿主机用系统 ffmpeg）。
# 镜像 tag: git-sha (精确回滚) + latest (默认拉取)。
# 仓库: ghcr.io/chentianxiong123/mybilibili-{core,search,msg-danmaku,live,ai,studio,work,bili,web,admin}

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'proto/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      services:
        description: "要构建的服务（逗号分隔，空=全部）"
        required: false
        default: "all"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/chentianxiong123/mybilibili

jobs:
  # ---------- 静态检查 + 编译 + 单元测试（门禁） ----------
# CI 与本地使用同一份 scripts/test.sh —— 禁止维护两套测试逻辑
test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.work

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: 后端 Go 单测 + 覆盖率门禁（加权）
      run: bash ./scripts/test.sh backend-cov

  # ---------- 前端单元测试 ----------
frontend-test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: 前端 vitest（web/user + web/admin）
      run: bash ./scripts/test.sh frontend

  # ---------- 集成测试（需要 docker compose） ----------
integration-test:
  needs: [test, frontend-test]
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.work

    - name: 启动测试环境
      run: |
        cd tests/integration
        docker compose -f docker-compose.test.yml up -d --wait

    - name: 等待服务就绪
      run: sleep 15

    - name: 跑集成测试（统一入口）
      run: bash ./scripts/test.sh integration

    - name: 清理
      if: always()
      run: cd tests/integration && docker compose -f docker-compose.test.yml down -v

  # ---------- Python E2E ----------
  # 当前在 CI 中暂不启用（需要 CI runner 起完整 dev/docker-compose.yml）。
  # 本地入口：bash ./scripts/test.sh e2e
  # 启用方法：uncomment 下面整块 + 把 build-backend.needs / build-frontend.needs 加它
  # e2e-test:
  #   needs: [test, frontend-test, integration-test]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: '3.13' }
  #     - run: pip install pytest playwright pytest-playwright
  #     - name: 启动后端
  #       run: docker compose -f dev/docker-compose.yml up -d --wait
  #     - run: sleep 30
  #     - run: bash ./scripts/test.sh e2e

  # ---------- 后端 8 个服务 ----------
  build-backend:
    needs: [test, frontend-test, integration-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: core,          name: core,        target: runtime}
          - {service: search,        name: search,      target: runtime}
          - {service: msg-danmaku,   name: msg-danmaku, target: runtime}
          - {service: live,          name: live,        target: runtime}
          - {service: ai,            name: ai,          target: runtime}
          - {service: studio,        name: studio,      target: runtime}
          - {service: work,          name: work,        target: runtime}
          # transcoder 不做容器（裸跑宿主机用系统 ffmpeg），不建镜像
          - {service: bili-proxy,    name: bili,        target: runtime}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 前端 2 应用 (wap 将来打包为 App，不建镜像) ----------
  build-frontend:
    needs: [test, frontend-test, integration-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web,    context: web/user,   port: 3200}
          - {name: admin,  context: web/admin,   port: 3100}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
