# ====== mybilibili 后端服务编排（8 个 Go 服务 + 基础设施）======
# 本文件通过 include 引入根目录 infra-compose.yml 的基础设施（pg/redis/minio/nats），
# 因此 docker compose -f deploy/docker-compose.yml up -d --build 一条命令即可全栈启动。
#
# 用法:
#   docker compose -f deploy/docker-compose.yml up -d --build  # 构建并起全部
#   docker compose -f deploy/docker-compose.yml up -d          # 用已有镜像起
#   docker compose -f deploy/docker-compose.yml down           # 停全部
#   或 scripts/backend.sh docker up / docker down
#
# 前端（web/admin/wap）开发时仍 pnpm dev 裸跑，不在此编排。

include:
  - path: ../infra-compose.yml

# 统一构建配置：所有 Go 服务共用 mybilibili-go/Dockerfile，通过 SERVICE build-arg 区分。
# x- 为 compose 扩展字段，不产生服务，仅用于 YAML 锚点复用。
x-go-build: &go-build
  context: ../mybilibili-go
  dockerfile: Dockerfile

services:
  core:
    image: mybilibili-core:latest
    build:
      <<: *go-build
      args:
        SERVICE: core-service
    container_name: mybilibili-core
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
    ports:
      - "8080:8080"   # traefik 直连 + 本地直连 (开发期 debug)
    labels:
      - "traefik.enable=true"
      # 默认路由：/api/v1 大部分路径走 core
      - "traefik.http.routers.core.rule=Host(`localhost`) && (PathPrefix(`/api/v1`) || PathPrefix(`/uploads`) || PathPrefix(`/covers`) || PathPrefix(`/videos`))"
      - "traefik.http.routers.core.entrypoints=web"
      - "traefik.http.services.core.loadbalancer.server.port=8080"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-redis: {condition: service_started}
      nats: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  search:
    image: mybilibili-search:latest
    build:
      <<: *go-build
      args:
        SERVICE: search-service
    container_name: mybilibili-search
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8084
      - GRPC_ADDR=:9084
    ports: ["8084:8084"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.search.rule=Host(`localhost`) && PathPrefix(`/api/v1/search`)"
      - "traefik.http.routers.search.entrypoints=web"
      - "traefik.http.services.search.loadbalancer.server.port=8084"
      # 优先级高于 core
      - "traefik.http.routers.search.priority=100"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  msg-danmaku:
    image: mybilibili-msg-danmaku:latest
    build:
      <<: *go-build
      args:
        SERVICE: msg-danmaku-service
    container_name: mybilibili-msg-danmaku
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8086
      - GRPC_ADDR=:9086
    ports: ["8086:8086"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msg.rule=Host(`localhost`) && (PathPrefix(`/api/v1/danmaku`) || PathPrefix(`/api/v1/message`))"
      - "traefik.http.routers.msg.entrypoints=web"
      - "traefik.http.services.msg.loadbalancer.server.port=8086"
      - "traefik.http.routers.msg.priority=100"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-redis: {condition: service_started}
    networks: [mylib]

  live:
    image: mybilibili-live:latest
    build:
      <<: *go-build
      args:
        SERVICE: live-service
    container_name: mybilibili-live
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8087
    ports: ["8087:8087"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.live.rule=Host(`localhost`) && PathPrefix(`/api/v1/live`)"
      - "traefik.http.routers.live.entrypoints=web"
      - "traefik.http.services.live.loadbalancer.server.port=8087"
      - "traefik.http.routers.live.priority=100"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  ai:
    image: mybilibili-ai:latest
    build:
      <<: *go-build
      args:
        SERVICE: ai-service
    container_name: mybilibili-ai
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8088
      - GRPC_ADDR=:9088
    ports: ["8088:8088"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=Host(`localhost`) && (PathPrefix(`/api/v1/ai`) || PathPrefix(`/api/v1/subtitle`))"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=8088"
      - "traefik.http.routers.ai.priority=100"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  studio:
    image: mybilibili-studio:latest
    build:
      <<: *go-build
      args:
        SERVICE: studio-service
    container_name: mybilibili-studio
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - HTTP_ADDR=:8089
    ports: ["8089:8089"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`localhost`) && PathPrefix(`/api/v1/studio`)"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.services.studio.loadbalancer.server.port=8089"
      - "traefik.http.routers.studio.priority=100"
    volumes:
      - studio-data:/data/studio
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  work:
    image: mybilibili-work:latest
    build:
      <<: *go-build
      args:
        SERVICE: work-service
    container_name: mybilibili-work
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - TRANSCODER_ADDR=http://172.18.0.1:8092
      - AI_ADDR=http://mybilibili-ai:8088
    volumes:
      - work-tmp:/tmp/work
    depends_on:
      pg16: {condition: service_started}
      nats: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  bili:
    image: mybilibili-bili:latest
    build:
      <<: *go-build
      args:
        SERVICE: bili-proxy-service
    container_name: mybilibili-bili
    restart: unless-stopped
    env_file: [".env"]
    environment:
      - LISTEN=:8091
    ports: ["8091:8091"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bili.rule=Host(`localhost`) && PathPrefix(`/api/v1/bili`)"
      - "traefik.http.routers.bili.entrypoints=web"
      - "traefik.http.services.bili.loadbalancer.server.port=8091"
      - "traefik.http.routers.bili.priority=100"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

volumes:
  studio-data:
  work-tmp:

networks:
  mylib:
    external: true
