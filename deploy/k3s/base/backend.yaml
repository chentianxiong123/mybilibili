          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: mybilibili-config}
            - secretRef: {name: mybilibili-secret}
          env:
            - {name: AI_ADDR, value: "http://ai:8088"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            exec: {command: ["sh", "-c", "test -d /proc/1"]}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts: [{name: tmp, mountPath: /tmp/work}]
      volumes:
        - name: tmp
          persistentVolumeClaim: {claimName: work-tmp}
---
