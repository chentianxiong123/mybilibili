# 后端 8 服务 Deployment（镜像来自 GHCR，transcoder 不部署=裸跑宿主机）
# 公共环境变量通过 envFrom 注入 ConfigMap/Secret。
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: core, namespace: mybilibili}
spec:
  replicas: 2
  selector: {matchLabels: {app: core}}
  template:
    metadata: {labels: {app: core}}
    spec:
      containers:
        - name: core
          image: ghcr.io/chentianxiong123/mybilibili-core:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: mybilibili-config}
            - secretRef: {name: mybilibili-secret}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: GRPC_ADDR, value: ":9090"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /api/v1/health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
