apiVersion: apps/v1
kind: Deployment
metadata: {name: studio, namespace: mybilibili}
spec:
  replicas: 2
  selector: {matchLabels: {app: studio}}
  template:
    metadata: {labels: {app: studio}}
    spec:
      nodeSelector:
        kubernetes.io/hostname: laptop
      containers:
        - name: studio
          image: ghcr.io/chentianxiong123/mybilibili-studio@sha256:af8515ae1560b182eaf710a3eaa80baee638bedd20c81937f7325d361ef738bb
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: mybilibili-config}
            - secretRef: {name: mybilibili-secret}
          env:
            - {name: HTTP_ADDR, value: ":8089"}
          ports: [{containerPort: 8089}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /api/v1/health, port: 8089}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health, port: 8089}, initialDelaySeconds: 15, periodSeconds: 20}
          volumeMounts: [{name: data, mountPath: /data/studio}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studio-data}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: work, namespace: mybilibili}
spec:
  replicas: 1
  selector: {matchLabels: {app: work}}
  template:
    metadata: {labels: {app: work}}
    spec:
      nodeSelector:
        kubernetes.io/hostname: laptop
      containers:
        - name: work
          image: ghcr.io/chentianxiong123/mybilibili-work@sha256:16c136dbf3ccc4cf88081947c9b909c6a6b341744dfd2dc3c7f5650ab7c14410
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: mybilibili-config}
            - secretRef: {name: mybilibili-secret}
          env:
            - {name: AI_ADDR, value: "http://ai:8088"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            exec: {command: ["sh", "-c", "test -d /proc/1"]}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts: [{name: tmp, mountPath: /tmp/work}]
      volumes:
        - name: tmp
          persistentVolumeClaim: {claimName: work-tmp}
---
