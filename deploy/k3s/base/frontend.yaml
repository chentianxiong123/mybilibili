# 前端：web(Nuxt SSR,bun:3200) + admin(Vite SPA,nginx:3100)
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: mybilibili}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/chentianxiong123/mybilibili-web:latest
          imagePullPolicy: Always
          env:
            - {name: NITRO_PORT, value: "3200"}
          ports: [{containerPort: 3200}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /, port: 3200}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 3200}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: mybilibili}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 3200, targetPort: 3200}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, namespace: mybilibili}
spec:
  replicas: 1
  selector: {matchLabels: {app: admin}}
  template:
    metadata: {labels: {app: admin}}
    spec:
      containers:
        - name: admin
          image: ghcr.io/chentianxiong123/mybilibili-admin:latest
          imagePullPolicy: Always
          ports: [{containerPort: 3100}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /admin/, port: 3100}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /admin/, port: 3100}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: admin, namespace: mybilibili}
spec:
  selector: {app: admin}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
