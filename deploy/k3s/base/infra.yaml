# 生产基础设施（PG/Redis/MinIO/NATS）— 部署到 mybilibili namespace
# 数据通过 local-path StorageClass 持久化到 /vol1/k3s
#
# PG 主从拓扑：
#   - postgres-primary  → fnos 节点 (writes)
#   - postgres-replica  → laptop 节点 (reads, streaming replication)
# 两 Deployment 共用同一镜像 pg16-zhparser:latest, 通过 PG_ROLE env 切换
# 启动模式: primary = postgres ; replica = pg_basebackup + standby.signal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data-primary
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data-replica
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
# =============== PostgreSQL PRIMARY (fnos) ===============
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres, role: primary }
  template:
    metadata:
      labels: { app: postgres, role: primary }
    spec:
      nodeSelector:
        kubernetes.io/hostname: fnos
      containers:
        - name: postgres
          image: pg16-zhparser:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/entrypoint.sh"]
          args: ["postgres"]
          env:
            - { name: PG_ROLE, value: primary }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: mybilibili }
            - { name: PG_REPL_USER, valueFrom: { secretKeyRef: { name: pg-repl-secret, key: user } } }
            - { name: PG_REPL_PASSWORD, valueFrom: { secretKeyRef: { name: pg-repl-secret, key: password } } }
          ports:
            - { containerPort: 5432 }
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 5432}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5432}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: entrypoint, mountPath: /usr/local/bin/entrypoint.sh, subPath: entrypoint.sh }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pg-data-primary }
        - name: entrypoint
          configMap:
            name: pg-entrypoint
            defaultMode: 0755
---
# =============== PostgreSQL REPLICA (laptop) ===============
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-replica
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres, role: replica }
  template:
    metadata:
      labels: { app: postgres, role: replica }
    spec:
      nodeSelector:
        kubernetes.io/hostname: laptop
      containers:
        - name: postgres
          image: pg16-zhparser:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/entrypoint.sh"]
          args: ["postgres"]
          env:
            - { name: PG_ROLE, value: replica }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: mybilibili }
            - { name: PG_REPL_USER, valueFrom: { secretKeyRef: { name: pg-repl-secret, key: user } } }
            - { name: PG_REPL_PASSWORD, valueFrom: { secretKeyRef: { name: pg-repl-secret, key: password } } }
            - { name: PG_PRIMARY_HOST, value: postgres-primary }
            - { name: PG_PRIMARY_PORT, value: "5432" }
          ports:
            - { containerPort: 5432 }
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 5432}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5432}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: entrypoint, mountPath: /usr/local/bin/entrypoint.sh, subPath: entrypoint.sh }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pg-data-replica }
        - name: entrypoint
          configMap:
            name: pg-entrypoint
            defaultMode: 0755
---
# 单写库 Service：应用只连 primary。replica 仅供运维手动查询
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres, role: primary }
  ports:
    - { port: 5432, targetPort: 5432 }
---
# 单独 Service 给运维工具/replica pod 寻址用
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
spec:
  selector: { app: postgres, role: primary }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
spec:
  selector: { app: postgres, role: replica }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--save", ""]
          ports:
            - { containerPort: 6379 }
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: minioadmin }
            - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:latest
          imagePullPolicy: IfNotPresent
          command: ["nats-server", "-js", "--store_dir=/data"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 4222}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 4222}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nats-data }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
