# Traefik IngressRoute + Middleware：翻译 docker-traefik/dynamic.yml 路由规则
# k3s 自带 traefik，用 CRD 实现 path 路由 + JWT forwardAuth + 限流 + 压缩
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: jwt-auth, namespace: mybilibili}
spec:
  forwardAuth:
    address: "http://core.mybilibili.svc.cluster.local:8080/api/v1/auth/verify"
    authResponseHeaders:
      - X-User-Id
      - X-User-Role
      - X-Admin-Id
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rate-limit, namespace: mybilibili}
spec:
  rateLimit:
    average: 100
    burst: 200
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: compress, namespace: mybilibili}
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: security-headers, namespace: mybilibili}
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: static-cache, namespace: mybilibili}
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: html-no-cache, namespace: mybilibili}
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "no-cache, no-store, must-revalidate"
---
# IngressRoute：统一入口，按 path 路由到各服务
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: mybilibili, namespace: mybilibili}
spec:
  entryPoints:
    - web
  routes:
    # 认证端点（不挂 jwt-auth，避免 forwardAuth 死循环 + 登录注册不需要 token）
    - match: PathPrefix(`/api/v1/auth/`) || PathPrefix(`/api/v1/user/login`) || PathPrefix(`/api/v1/admin/login`) || PathPrefix(`/api/v1/user/register`)
      kind: Rule
      priority: 20
      services: [{name: core, port: 8080}]
      middlewares: [{name: rate-limit}, {name: security-headers}]
    # 健康检查（不挂 jwt-auth）
    - match: PathPrefix(`/api/v1/health`)
      kind: Rule
      priority: 20
      services: [{name: core, port: 8080}]
      middlewares: [{name: security-headers}]
    # 搜索历史（core 处理，优先级高于 search）
    - match: PathPrefix(`/api/v1/search/history`)
      kind: Rule
      priority: 20
      services: [{name: core, port: 8080}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 搜索/推荐/创作者/画像 → search
    - match: PathPrefix(`/api/v1/search/`) || PathPrefix(`/api/v1/recommend/`) || PathPrefix(`/api/v1/creator/stats/`) || PathPrefix(`/api/v1/profile/`)
      kind: Rule
      priority: 15
      services: [{name: search, port: 8084}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 弹幕/消息 → msg-danmaku
    - match: PathPrefix(`/api/v1/danmaku/`) || PathPrefix(`/api/v1/message/`)
      kind: Rule
      priority: 15
      services: [{name: msg-danmaku, port: 8086}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 直播 → live
    - match: PathPrefix(`/api/v1/live/`)
      kind: Rule
      priority: 15
      services: [{name: live, port: 8087}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 字幕/AI → ai
    - match: PathPrefix(`/api/v1/subtitle/`) || PathPrefix(`/api/v1/ai/`)
      kind: Rule
      priority: 15
      services: [{name: ai, port: 8088}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 创作中心 → studio
    - match: PathPrefix(`/api/v1/studio/`) || PathPrefix(`/assets/studio/`)
      kind: Rule
      priority: 15
      services: [{name: studio, port: 8089}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # SSE 推送（不需要 JWT，EventSource 不带自定义头）
    - match: PathPrefix(`/sse/`)
      kind: Rule
      priority: 12
      services: [{name: core, port: 8080}]
      middlewares: [{name: security-headers}]
    # WebSocket（live 语聊房）
    - match: PathPrefix(`/ws/`)
      kind: Rule
      priority: 12
      services: [{name: live, port: 8087}]
      middlewares: [{name: jwt-auth}]
    # 静态资源（hash 文件永久缓存）
    - match: PathPrefix(`/_nuxt/`)
      kind: Rule
      priority: 11
      services: [{name: web, port: 3200}]
      middlewares: [{name: static-cache}, {name: compress}, {name: security-headers}]
    # 管理后台
    - match: PathPrefix(`/admin/`)
      kind: Rule
      priority: 10
      services: [{name: admin, port: 3100}]
      middlewares: [{name: html-no-cache}, {name: compress}, {name: security-headers}]
    # 通用 API（带 JWT）
    - match: PathPrefix(`/api/`)
      kind: Rule
      priority: 5
      services: [{name: core, port: 8080}]
      middlewares: [{name: jwt-auth}, {name: rate-limit}, {name: security-headers}]
    # 上传/封面/视频静态资源 → core
    - match: PathPrefix(`/uploads/`) || PathPrefix(`/covers/`) || PathPrefix(`/videos/`)
      kind: Rule
      priority: 8
      services: [{name: core, port: 8080}]
      middlewares: [{name: security-headers}]
    # 默认 → web SSR
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services: [{name: web, port: 3200}]
      middlewares: [{name: html-no-cache}, {name: compress}, {name: security-headers}]
