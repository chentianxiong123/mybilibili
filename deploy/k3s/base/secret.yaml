# 敏感配置（生产务必用 SealedSecret / 外部 Secret 管理；此处为演示占位）
apiVersion: v1
kind: Secret
metadata:
  name: mybilibili-secret
  namespace: mybilibili
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-change-in-production"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
---
# PG 流复制用户凭据（primary + replica 共享同一 Secret）
apiVersion: v1
kind: Secret
metadata:
  name: pg-repl-secret
  namespace: mybilibili
type: Opaque
stringData:
  user: "repluser"
  password: "replpass-2026"
---
# GHCR 私有镜像拉取凭证（所有 Deployment 都通过 imagePullSecrets 引用此 Secret）
# 创建方式（一次性，凭据存在本地 ~/.docker/config.json 或用 token）：
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<github-pat-with-read:packages> \
#     -n mybilibili
#
# 此 yaml 仅占位，**不要把真实 token 提交到 git**。Apply 后用
# `kubectl create secret docker-registry ghcr-secret ...` 替换 / 创建实际 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: mybilibili
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"REPLACE_ME","password":"REPLACE_ME","auth":"REPLACE_ME_BASE64"}}}