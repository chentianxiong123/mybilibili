# 后端 ClusterIP Service（供 core 反代 + 前端 nginx 反代使用）
---
apiVersion: v1
kind: Service
metadata: {name: core, namespace: mybilibili}
spec:
  selector: {app: core}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: search, namespace: mybilibili}
spec:
  selector: {app: search}
  ports:
    - {name: grpc, port: 9084, targetPort: 9084}
---
apiVersion: v1
kind: Service
metadata: {name: msg-danmaku, namespace: mybilibili}
spec:
  selector: {app: msg-danmaku}
  ports:
    - {name: grpc, port: 9086, targetPort: 9086}
---
apiVersion: v1
kind: Service
metadata: {name: live, namespace: mybilibili}
spec:
  selector: {app: live}
  ports:
    - {name: http, port: 8087, targetPort: 8087}
---
apiVersion: v1
kind: Service
metadata: {name: ai, namespace: mybilibili}
spec:
  selector: {app: ai}
  ports:
    - {name: grpc, port: 9088, targetPort: 9088}
---
apiVersion: v1
kind: Service
metadata: {name: studio, namespace: mybilibili}
spec:
  selector: {app: studio}
  ports:
    - {name: http, port: 8089, targetPort: 8089}
---
apiVersion: v1
kind: Service
metadata: {name: work, namespace: mybilibili}
spec:
  selector: {app: work}
  ports:
    - {name: http, port: 8082, targetPort: 8082}
---
apiVersion: v1
kind: Service
metadata: {name: bili, namespace: mybilibili}
spec:
  selector: {app: bili}
  ports:
    - {name: http, port: 8091, targetPort: 8091}