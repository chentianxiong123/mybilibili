# Service：每个服务暴露 HTTP + gRPC 双端口，traefik 按 path 路由 HTTP，core 走 gRPC 调下游
---
apiVersion: v1
kind: Service
metadata: {name: core, namespace: mybilibili}
spec:
  selector: {app: core}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: grpc, port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: Service
metadata: {name: search, namespace: mybilibili}
spec:
  selector: {app: search}
  ports:
    - {name: http, port: 8084, targetPort: 8084}
    - {name: grpc, port: 9084, targetPort: 9084}
---
apiVersion: v1
kind: Service
metadata: {name: msg-danmaku, namespace: mybilibili}
spec:
  selector: {app: msg-danmaku}
  ports:
    - {name: http, port: 8086, targetPort: 8086}
    - {name: grpc, port: 9086, targetPort: 9086}
---
apiVersion: v1
kind: Service
metadata: {name: live, namespace: mybilibili}
spec:
  selector: {app: live}
  ports:
    - {name: http, port: 8087, targetPort: 8087}
---
apiVersion: v1
kind: Service
metadata: {name: ai, namespace: mybilibili}
spec:
  selector: {app: ai}
  ports:
    - {name: http, port: 8088, targetPort: 8088}
    - {name: grpc, port: 9088, targetPort: 9088}
---
apiVersion: v1
kind: Service
metadata: {name: studio, namespace: mybilibili}
spec:
  selector: {app: studio}
  ports:
    - {name: http, port: 8089, targetPort: 8089}
---
apiVersion: v1
kind: Service
metadata: {name: bili, namespace: mybilibili}
spec:
  selector: {app: bili}
  ports:
    - {name: http, port: 8091, targetPort: 8091}
