# 基础设施（k8s 内与 docker-compose 同名 Service，保证 Pod 内 DNS 一致）
---
apiVersion: v1
kind: Service
metadata:
  name: pg16
  namespace: mybilibili
spec:
  selector: {app: pg16}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg16
  namespace: mybilibili
spec:
  replicas: 1
  selector: {matchLabels: {app: pg16}}
  template:
    metadata: {labels: {app: pg16}}
    spec:
      containers:
        - name: pg16
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: "postgres"}
            - {name: POSTGRES_PASSWORD, value: "postgres"}
            - {name: POSTGRES_DB, value: "mybilibili"}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pg16-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg16-data
  namespace: mybilibili
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mybilibili-redis
  namespace: mybilibili
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mybilibili
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: mybilibili
spec:
  selector: {app: nats}
  ports:
    - {name: nats, port: 4222, targetPort: 4222}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: mybilibili
spec:
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          command: ["nats-server", "-js"]
          ports: [{containerPort: 4222}]
---
apiVersion: v1
kind: Service
metadata:
  name: mybilibili-minio
  namespace: mybilibili
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mybilibili
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: "minioadmin"}
            - {name: MINIO_ROOT_PASSWORD, value: "minioadmin"}
          ports:
            - {containerPort: 9000}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: mybilibili
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}