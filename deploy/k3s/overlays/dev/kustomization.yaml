# dev 环境 overlay：单副本 + NodePort 暴露关键入口
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mybilibili

resources:
  - ../../base
  - infra.yaml

patches:
  # 所有 Deployment 挂载 ghcr 拉取凭证 + 本地有镜像则复用（docker 运行时）
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-secret}]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # 暴露 core(8080)、web(3200)、admin(3100) 为 NodePort
  - target: {kind: Service, name: core}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: {kind: Service, name: web}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30320
  - target: {kind: Service, name: admin}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30310

images:
  - name: ghcr.io/chentianxiong123/mybilibili-core
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-search
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-msg-danmaku
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-live
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-ai
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-studio
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-work
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-bili
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-web
    newTag: latest
  - name: ghcr.io/chentianxiong123/mybilibili-admin
    newTag: latest