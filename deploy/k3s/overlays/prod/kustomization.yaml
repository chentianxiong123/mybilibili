# prod overlay: 生产环境 infra(PG/MinIO/Redis/NATS) 部署在 k3s 集群内（同 namespace）。
# base configmap 已指向集群内 infra，此 overlay 只覆盖镜像 tag。
# 部署: kubectl apply -k overlays/prod
# 升级: 改 newTag 为新 git-sha, 重新 apply
# 回滚: 改 newTag 回旧 git-sha, 重新 apply
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mybilibili

resources:
  - ../../base

patches: []

# 锁定镜像版本到 git sha（CI 每次构建推 {latest, git-sha} 两个 tag）
images:
  - name: ghcr.io/chentianxiong123/mybilibili-core
    newTag: b7863aa4b9e67e8efb9836f28dfa49b3eb4f97dc
  - name: ghcr.io/chentianxiong123/mybilibili-search
    newTag: b7863aa4b9e67e8efb9836f28dfa49b3eb4f97dc
