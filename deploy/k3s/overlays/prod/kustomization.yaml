# prod overlay: 部署机连开发机 infra(PG/MinIO/Redis/NATS)，不部署自己的 infra。
# 开发机 IP 默认 192.168.31.204，改这里即可。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mybilibili

resources:
  - ../../base

patches:
  # ConfigMap 指向开发机的基础设施（有数据的那套）
  - target: {kind: ConfigMap, name: mybilibili-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mybilibili-config
      data:
        PG_DSN: "postgres://postgres:postgres@192.168.31.204:5432/mybilibili?sslmode=disable"
        REDIS_ADDR: "192.168.31.204:6379"
        NATS_URL: "nats://192.168.31.204:4222"
        MINIO_ENDPOINT: "http://192.168.31.204:9000"
        TRANSCODER_ADDR: "http://192.168.31.204:8092"

  # 所有 Deployment 挂载 ghcr 拉取凭证
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-secret}]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # NodePort 暴露入口
  - target: {kind: Service, name: core}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: {kind: Service, name: web}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30320
  - target: {kind: Service, name: admin}
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30310