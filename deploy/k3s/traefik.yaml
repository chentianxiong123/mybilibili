---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traefik, namespace: kube-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: traefik}}
  template:
    metadata: {labels: {app: traefik}}
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3
          args:
            - --providers.kubernetesCRD=true
            - --providers.kubernetesCRD.allowCrossNamespace=true
            - --entryPoints.web.address=:80
            - --entryPoints.websecure.address=:443
            - --api.dashboard=false
            - --log.level=INFO
          ports:
            - {name: web, containerPort: 80}
            - {name: websecure, containerPort: 443}
---
apiVersion: v1
kind: Service
metadata: {name: traefik, namespace: kube-system}
spec:
  type: NodePort
  selector: {app: traefik}
  ports:
    - {name: web, port: 80, targetPort: 80, nodePort: 31418}
    - {name: websecure, port: 443, targetPort: 443, nodePort: 31419}
