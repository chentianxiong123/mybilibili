# SRS 配置 - 支持 RTMP (OBS) + WebRTC (浏览器 WHIP) 推流, HTTP-FLV 播放
listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

http_api {
    enabled on;
    listen 19854;
}

http_server {
    enabled on;
    listen 28080;
    dir ./objs/nginx/html;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate 192.168.31.204;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled on;
        on_publish http://live:8087/api/v1/live/srs/hook;
        on_unpublish http://live:8087/api/v1/live/srs/hook;
    }
    hls {
        enabled on;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled on;
        rtmp_to_rtc off;
        rtc_to_rtmp on;
    }
    play {
        gop_cache_max_frames 30;
        queue_length 10;
    }
}