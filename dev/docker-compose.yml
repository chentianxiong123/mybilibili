# =====================================================================
#  【开发机】 mybilibili docker compose 编排（ALL-IN-ONE，全容器化）
#  适用机器: 开发机（工作站）。生产由部署机 fnos k3s 承担（见 deploy/k3s/）。
#  一键全起:
#     docker compose -f dev/docker-compose.yml up -d --build
#  架构:
#   浏览器 → http://localhost:80 (traefik) → path 路由 → 具体服务
#   - 后端 8 服务: docker provider labels 定义路由
#   - 前端 web/admin/wap: 容器化运行 dev 进程, 由 traefik 按 path 路由
#   - 基础设施: pg/redis/minio/nats 同组
#  端口段（避免多项目冲突）:
#   基础设施: 15432/16379/14222/19000-19001/11935
#   后端:     8080/8084/8086-8089/8091 (独立不冲突)
#   前端:     3100/3200/5174 (独立不冲突)
# 路由表:
#   /admin/*            → admin:3100      (Vite SPA)
#   /wap/*              → wap:5174        (Vite SPA)
#   /api/v1/search/*    → search:8084
#   /api/v1/recommend/* → search:8084
#   /api/v1/danmaku/*   → msg-danmaku:8086
#   /api/v1/message/*   → msg-danmaku:8086
#   /api/v1/live/*      → live:8087
#   /api/v1/ai/*        → ai:8088
#   /api/v1/subtitle/*  → ai:8088
#   /api/v1/studio/*    → studio:8089
#   /api/v1/bili/*      → bili:8091
#   /api/v1/* (default) → core:8080
#   /uploads /covers /videos → core:8080
#   /sse/*              → core:8080
#   /ws/*               → live:8087
#   /                   → web:3200       (Nuxt SSR, default catch-all)

# 统一 Go 构建配置: 所有服务共用根目录 Dockerfile, 通过 SERVICE build-arg 区分。
x-go-build: &go-build
  context: ..
  dockerfile: Dockerfile
  target: dev

# Go 缓存 bind mount（复用宿主机现有缓存，不重新下载）
x-go-cache: &go-cache
  - /home/a1/go/pkg/mod:/go/pkg/mod
  - /home/a1/.cache/go-build:/root/.cache/go-build

services:
  # ================= 统一入口 =================
  traefik:
    image: traefik:v3.1
    container_name: mybilibili-traefik
    restart: no
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8082"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "8082:8082"  # traefik dashboard (仅 dev)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mylib]

  # ================= 基础设施（端口避开其他项目）=================
  pg16:
    image: pg16-zhparser
    container_name: pg16-zhparser
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mybilibili
    ports:
      - "15432:5432"
    volumes:
      - pg16-data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    networks: [mylib]

  mybilibili-redis:
    image: redis:7-alpine
    container_name: mybilibili-redis
    restart: no
    command: ["redis-server", "--save", ""]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks: [mylib]

  mybilibili-minio:
    image: minio/minio:latest
    container_name: mybilibili-minio
    restart: no
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    networks: [mylib]

  nats:
    image: nats:latest
    container_name: nats
    restart: no
    command: ["-js", "--store_dir=/data"]
    ports:
      - "14222:4222"
      - "18222:8222"
    volumes:
      - nats-data:/data
    networks: [mylib]

  srs:
    image: registry.cn-hangzhou.aliyuncs.com/ossrs/srs:5
    container_name: mybilibili-srs
    restart: no
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "11935:1935"        # RTMP 推流（OBS）
      - "12808:28080"      # HTTP-FLV 播放
      - "18000:8000/udp"    # WebRTC UDP 端口
      - "11985:19854"      # HTTP API / WHIP 推流
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    depends_on:
      live: {condition: service_started}
    networks: [mylib]

  # ================= 后端 8 服务（Go 缓存复用宿主机）=================
  core:
    image: mybilibili-core:dev
    build:
      <<: *go-build
      args:
        SERVICE: core
    container_name: mybilibili-core
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - SERVICE=core
    ports:
      - "8080:8080"   # 本地直连 debug（绕过 traefik）
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.entrypoints=web"
      - "traefik.http.routers.core.rule=Host(`localhost`) && (PathPrefix(`/api/v1/`) || PathPrefix(`/uploads/`) || PathPrefix(`/covers/`) || PathPrefix(`/videos/`) || PathPrefix(`/sse/`))"
      - "traefik.http.services.core.loadbalancer.server.port=8080"
      - "traefik.http.routers.core.priority=5"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-redis: {condition: service_started}
      nats: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  search:
    image: mybilibili-search:dev
    build:
      <<: *go-build
      args:
        SERVICE: search
    container_name: mybilibili-search
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8084
      - GRPC_ADDR=:9084
      - SERVICE=search
    ports: ["8084:8084"]
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.search.entrypoints=web"
      - "traefik.http.routers.search.rule=Host(`localhost`) && (PathPrefix(`/api/v1/search/`) || PathPrefix(`/api/v1/recommend/`) || PathPrefix(`/api/v1/creator/stats/`) || PathPrefix(`/api/v1/profile/`))"
      - "traefik.http.services.search.loadbalancer.server.port=8084"
      - "traefik.http.routers.search.priority=10"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  msg-danmaku:
    image: mybilibili-msg-danmaku:dev
    build:
      <<: *go-build
      args:
        SERVICE: msg-danmaku
    container_name: mybilibili-msg-danmaku
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8086
      - GRPC_ADDR=:9086
      - SERVICE=msg-danmaku
    ports: ["8086:8086"]
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msg.entrypoints=web"
      - "traefik.http.routers.msg.rule=Host(`localhost`) && (PathPrefix(`/api/v1/danmaku/`) || PathPrefix(`/api/v1/message/`))"
      - "traefik.http.services.msg.loadbalancer.server.port=8086"
      - "traefik.http.routers.msg.priority=10"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-redis: {condition: service_started}
    networks: [mylib]

  live:
    image: mybilibili-live:dev
    build:
      <<: *go-build
      args:
        SERVICE: live
    container_name: mybilibili-live
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8087
      - SERVICE=live
    ports: ["8087:8087"]
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.live.entrypoints=web"
      - "traefik.http.routers.live.rule=Host(`localhost`) && (PathPrefix(`/api/v1/live/`) || PathPrefix(`/ws/`))"
      - "traefik.http.services.live.loadbalancer.server.port=8087"
      - "traefik.http.routers.live.priority=10"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  ai:
    image: mybilibili-ai:dev
    build:
      <<: *go-build
      args:
        SERVICE: ai
    container_name: mybilibili-ai
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8088
      - GRPC_ADDR=:9088
      - SERVICE=ai
    ports: ["8088:8088"]
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.routers.ai.rule=Host(`localhost`) && (PathPrefix(`/api/v1/ai/`) || PathPrefix(`/api/v1/subtitle/`))"
      - "traefik.http.services.ai.loadbalancer.server.port=8088"
      - "traefik.http.routers.ai.priority=10"
    depends_on:
      pg16: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  studio:
    image: mybilibili-studio:dev
    build:
      <<: *go-build
      args:
        SERVICE: studio
    container_name: mybilibili-studio
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - HTTP_ADDR=:8089
      - DATA_DIR=/data/studio
      - SERVICE=studio
    ports: ["8089:8089"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.routers.studio.rule=Host(`localhost`) && (PathPrefix(`/api/v1/studio/`) || PathPrefix(`/assets/studio/`))"
      - "traefik.http.services.studio.loadbalancer.server.port=8089"
      - "traefik.http.routers.studio.priority=10"
    volumes:
      - studio-data:/data/studio
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  work:
    image: mybilibili-work:dev
    build:
      <<: *go-build
      args:
        SERVICE: work
    container_name: mybilibili-work
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      # AI 服务地址（work 容器内用服务名直连 compose ai）
      - AI_ADDR=http://mybilibili-ai:8088
      # transcoder 池配置文件（容器内路径）
      - WORK_CONFIG_PATH=/etc/mybilibili/transcoders.yaml
      # admin HTTP 管理端口（节点 CRUD + 健康监控）
      - ADMIN_HTTP_ADDR=:8090
    tmpfs:
      - /tmp/work:size=512M
    volumes:
      - ../services/work/configs/transcoders.yaml:/etc/mybilibili/transcoders.yaml:ro
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.work-admin.entrypoints=web"
      - "traefik.http.routers.work-admin.rule=Host(`localhost`) && PathPrefix(`/api/v1/admin/transcoders`)"
      - "traefik.http.routers.work-admin.priority=20"
      - "traefik.http.services.work-admin.loadbalancer.server.port=8090"
    depends_on:
      pg16: {condition: service_started}
      nats: {condition: service_started}
      mybilibili-minio: {condition: service_started}
    networks: [mylib]

  bili:
    image: mybilibili-bili:dev
    build:
      <<: *go-build
      args:
        SERVICE: bili-proxy
    container_name: mybilibili-bili
    restart: no
    env_file: ["_env/common.env", "_env/dev.env", ".env"]
    environment:
      - LISTEN=:8091
      - SERVICE=bili-proxy
    ports: ["8091:8091"]
    volumes:
      - ../:/app
      - /home/a1/go/pkg/mod:/go/pkg/mod
      - /home/a1/.cache/go-build:/root/.cache/go-build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bili.entrypoints=web"
      - "traefik.http.routers.bili.rule=Host(`localhost`) && PathPrefix(`/api/v1/bili/`)"
      - "traefik.http.services.bili.loadbalancer.server.port=8091"
      - "traefik.http.routers.bili.priority=10"
    depends_on:
      pg16: {condition: service_started}
    networks: [mylib]

  # ================= 前端 3 服务（容器化 dev，挂源码 + HMR）================
  # 改代码: 编辑宿主 ./web/user、./web/admin 或 ./mobile/wap → 容器 volume 同步 → Vite/Nuxt HMR 自动刷新
  web:
    image: oven/bun:1-alpine
    container_name: mybilibili-web
    restart: no
    working_dir: /app
    command: ["sh", "-c", "test -d node_modules || bun install; bun run dev"]
    environment:
      - NITRO_PORT=3200
      - HOST=0.0.0.0
    volumes:
      - ../web/user:/app
      - /home/a1/.bun/install/cache:/root/.bun/install/cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=Host(`localhost`) && PathPrefix(`/`) && !PathPrefix(`/api/`) && !PathPrefix(`/admin/`) && !PathPrefix(`/wap/`) && !PathPrefix(`/uploads/`) && !PathPrefix(`/covers/`) && !PathPrefix(`/videos/`) && !PathPrefix(`/sse/`) && !PathPrefix(`/ws/`)"
      - "traefik.http.services.web.loadbalancer.server.port=3200"
      - "traefik.http.routers.web.priority=1"
    depends_on:
      core: {condition: service_started}
    networks: [mylib]

  admin:
    image: oven/bun:1-alpine
    container_name: mybilibili-admin
    restart: no
    working_dir: /app
    command: ["sh", "-c", "test -d node_modules || bun install; bun run dev"]
    environment:
      - HOST=0.0.0.0
    volumes:
      - ../web/admin:/app
      - /home/a1/.bun/install/cache:/root/.bun/install/cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.rule=Host(`localhost`) && PathPrefix(`/admin/`)"
      - "traefik.http.services.admin.loadbalancer.server.port=3100"
      - "traefik.http.routers.admin.priority=10"
    depends_on:
      core: {condition: service_started}
    networks: [mylib]

  wap:
    image: oven/bun:1-alpine
    container_name: mybilibili-wap
    restart: no
    working_dir: /app
    command: ["sh", "-c", "test -d node_modules || bun install; bun run dev"]
    environment:
      - HOST=0.0.0.0
    volumes:
      - ../mobile/wap:/app
      - /home/a1/.bun/install/cache:/root/.bun/install/cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wap.entrypoints=web"
      - "traefik.http.routers.wap.rule=Host(`localhost`) && PathPrefix(`/wap/`)"
      - "traefik.http.services.wap.loadbalancer.server.port=5174"
      - "traefik.http.routers.wap.priority=10"
    depends_on:
      core: {condition: service_started}
    networks: [mylib]

volumes:
  pg16-data:
    external: true
    name: pg16-data
  redis-data:
    external: true
    name: redis-data
  minio-data:
    external: true
    name: minio-data
  nats-data:
    external: true
    name: nats-data
  studio-data:
    external: true
    name: studio-data

networks:
  mylib:
    external: true
