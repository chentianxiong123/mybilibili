services:
  # ====== 反向代理（统一入口：localhost:80）======
  # 前端裸跑 (3200/3100) + 后端 compose 全走 traefik，对齐生产 k3s 架构
  # 路由规则：
  #   /api/v1/search/*  -> search:8084
  #   /api/v1/ai, /api/v1/subtitle -> ai:8088
  #   /api/v1/danmaku, /api/v1/message -> msg-danmaku:8086
  #   /api/v1/live      -> live:8087
  #   /api/v1/bili      -> bili:8091
  #   /api/v1/studio    -> studio:8089
  #   其他 /api/v1      -> core:8080
  #   /uploads, /covers, /videos -> core (静态资源)
  traefik:
    image: traefik:v3.1
    container_name: mybilibili-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8082"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "8082:8082"  # traefik dashboard & debug api (仅 dev)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mylib
    # 开发期 CORS（前端裸跑 3200/3100 → 后端 80，跨端口）
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.devcors.headers.accessControlAllowOriginList=http://localhost:3100,http://localhost:3200"
      - "traefik.http.middlewares.devcors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      - "traefik.http.middlewares.devcors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.devcors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.devcors.headers.accessControlMaxAge=3600"

  pg16:
    image: pg16-zhparser
    container_name: pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mybilibili
    ports:
      - "5432:5432"
    volumes:
      - pg16-data:/var/lib/postgresql/data
      - ./mybilibili-go/sql/000_mysql_data_pg.sql:/docker-entrypoint-initdb.d/000_mysql_data_pg.sql:ro
    networks:
      - mylib

  mybilibili-redis:
    image: redis:7-alpine
    container_name: mybilibili-redis
    restart: unless-stopped
    command: ["redis-server", "--save", ""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mylib

  mybilibili-minio:
    image: minio/minio:latest
    container_name: mybilibili-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mylib

  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped
    command: ["-js", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - mylib

volumes:
  pg16-data:
    external: true
    name: pg16-data
  redis-data:
  minio-data:
    external: true
    name: minio-data
  nats-data:
    external: true
    name: deploy_nats-data

networks:
  mylib:
    external: true
