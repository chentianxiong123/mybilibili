services:
  pg16:
    image: pg16-zhparser
    container_name: pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mybilibili
    ports:
      - "5432:5432"
    volumes:
      - pg16-data:/var/lib/postgresql/data
      - ./mybilibili-go/sql/000_mysql_data_pg.sql:/docker-entrypoint-initdb.d/000_mysql_data_pg.sql:ro
    networks:
      - mylib

  mybilibili-redis:
    image: redis:7-alpine
    container_name: mybilibili-redis
    restart: unless-stopped
    command: ["redis-server", "--save", ""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mylib

  mybilibili-minio:
    image: minio/minio:latest
    container_name: mybilibili-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mylib

  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped
    command: ["-js", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - mylib

volumes:
  pg16-data:
    external: true
    name: pg16-data
  redis-data:
  minio-data:
    external: true
    name: minio-data
  nats-data:
    external: true
    name: deploy_nats-data

networks:
  mylib:
    external: true