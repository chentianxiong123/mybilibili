name: mybilibili_app_flutter
description: "mybilibili Flutter client - Bilibili-style video platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # Video player
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_video: 1.0.5

  # Danmaku
  canvas_danmaku: ^0.3.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # pl_player dependencies
  get: ^4.7.3
  hive_ce: ^2.19.3
  flutter_volume_controller: ^2.0.1
  screen_brightness_platform_interface: ^0.1.0
  wakelock_plus: ^1.5.2
  window_manager: ^0.4.3
  flutter_smart_dialog: ^5.1.1
  native_device_orientation: ^2.1.1
  font_awesome_flutter: ^11.0.0
  material_design_icons_flutter: ^7.0.7296
  fl_chart: ^1.2.0
  archive: ^4.0.9
  easy_debounce: ^2.0.3
  collection: ^1.19.1
  path: ^1.9.1

  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true