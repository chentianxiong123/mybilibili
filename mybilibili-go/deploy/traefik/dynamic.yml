# Traefik 动态配置（路由规则）

# 中间件
http:
  middlewares:
    # JWT 认证（校验 token，透传 user_id 到后端）
    jwt-auth:
      forwardAuth:
        address: "http://localhost:8080/api/v1/auth/verify"
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-Admin-Id

    # 限流
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        sourceCriterion:
          ipStrategy:
            depth: 1

    # WebSocket 连接超时关闭
    ws-timeout:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    # Brotli/Gzip 压缩（排除 SSE）
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    # 安全头
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # 静态资源缓存（hash 文件永久缓存）
    static-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000, immutable"

    # HTML 不缓存
    html-no-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate"

# 路由规则
routers:
  # ＝＝＝ web 静态资源（hash 文件，永久缓存）＝＝＝
  web-static:
    rule: "Host(`mylib.com`) && PathPrefix(`/_nuxt/`)"
    priority: 20
    service: web
    middlewares:
      - static-cache
      - compress
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 静态资源（hash 文件，永久缓存）＝＝＝
  core-static:
    rule: "Host(`mylib.com`) && PathPrefix(`/assets/`)"
    priority: 20
    service: core
    middlewares:
      - static-cache
      - compress
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 管理后台（CSR，base /admin/）＝＝＝
  admin-web:
    rule: "Host(`mylib.com`) && PathPrefix(`/admin/`)"
    priority: 15
    service: admin
    middlewares:
      - html-no-cache
      - compress
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ web SSR（HTML 页面）＝＝＝
  core-web:
    rule: "Host(`mylib.com`)"
    priority: 1
    service: web
    middlewares:
      - html-no-cache
      - compress
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 验证端点（高 priority，不挂 jwt-auth，避免 forwardAuth 死循环）＝＝＝
  core-verify:
    rule: "Host(`mylib.com`) && PathPrefix(`/api/v1/auth/verify`)"
    priority: 20
    service: core
    middlewares:
      - rate-limit
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 搜索推荐 + 创作者分析 + 用户画像（搜索推荐服务）＝＝＝
  search-api:
    rule: "Host(`mylib.com`) && (PathPrefix(`/api/v1/search/`) || PathPrefix(`/api/v1/recommend/`) || PathPrefix(`/api/v1/creator/stats/`) || PathPrefix(`/api/v1/profile/`))"
    priority: 15
    service: search
    middlewares:
      - jwt-auth
      - rate-limit
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ API 路由（带 JWT）＝＝＝
  core-api:
    rule: "Host(`mylib.com`) && PathPrefix(`/api/v1/`)"
    priority: 10
    service: core
    middlewares:
      - jwt-auth
      - rate-limit
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 字幕（AI 服务）＝＝＝
  subtitle-api:
    rule: "Host(`mylib.com`) && PathPrefix(`/api/v1/subtitle/`)"
    priority: 15
    service: ai
    middlewares:
      - jwt-auth
      - rate-limit
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ 创作中心（studio 服务）＝＝＝
  studio-api:
    rule: "Host(`mylib.com`) && (PathPrefix(`/api/v1/studio/`) || PathPrefix(`/assets/studio/`))"
    priority: 15
    service: studio
    middlewares:
      - jwt-auth
      - rate-limit
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ SSE 推送（不需要 JWT，前端 EventSource 不带自定义头）＝＝＝
  core-sse:
    rule: "Host(`mylib.com`) && PathPrefix(`/sse/`)"
    priority: 10
    service: core
    middlewares:
      - security-headers
    tls:
      certResolver: letsencrypt

  # ＝＝＝ live 服务 WebSocket 信令（语聊房）＝＝＝
  live-ws:
    rule: "Host(`mylib.com`) && PathPrefix(`/ws/`)"
    priority: 10
    service: live
    middlewares:
      - jwt-auth
      - ws-timeout
    tls:
      certResolver: letsencrypt

  # ＝＝＝ gRPC 内部（服务间，不对外）＝＝＝
  grpc-internal:
    rule: "Host(`internal.mylib.com`)"
    service: core-grpc
    tls:
      certResolver: letsencrypt

# 服务
services:
  web:
    loadBalancer:
      servers:
        - url: "http://localhost:3200"
      healthCheck:
        path: /
        interval: 10s
        timeout: 3s

  admin:
    loadBalancer:
      servers:
        - url: "http://localhost:3100"
      healthCheck:
        path: /admin/
        interval: 10s
        timeout: 3s

  core:
    loadBalancer:
      servers:
        - url: "http://localhost:8080"
      healthCheck:
        path: /api/v1/health
        interval: 10s
        timeout: 3s

  core-grpc:
    loadBalancer:
      servers:
        - url: "h2c://localhost:9090"
      healthCheck:
        path: /grpc.health.v1.Health/Check
        interval: 10s
        timeout: 3s

  live:
    loadBalancer:
      servers:
        - url: "http://localhost:8081"
      healthCheck:
        path: /api/v1/health
        interval: 10s
        timeout: 3s

  search:
    loadBalancer:
      servers:
        - url: "http://localhost:8084"
      healthCheck:
        path: /api/v1/health
        interval: 10s
        timeout: 3s

  ai:
    loadBalancer:
      servers:
        - url: "http://localhost:8088"
      healthCheck:
        path: /api/v1/health
        interval: 10s
        timeout: 3s

  studio:
    loadBalancer:
      servers:
        - url: "http://localhost:8089"
      healthCheck:
        path: /api/v1/health
        interval: 10s
        timeout: 3s