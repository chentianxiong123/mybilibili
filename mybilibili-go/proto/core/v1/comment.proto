syntax = "proto3";

package core.v1;

option go_package = "mybilibili/internal/core/pb";

service CommentService {
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc AddReply(AddReplyRequest) returns (AddReplyResponse);
  rpc GetReplies(GetRepliesRequest) returns (GetRepliesResponse);
  rpc DeleteReply(DeleteReplyRequest) returns (DeleteReplyResponse);
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse);
  rpc LikeReply(LikeReplyRequest) returns (LikeReplyResponse);
  rpc UnlikeReply(UnlikeReplyRequest) returns (UnlikeReplyResponse);
}

message CommentInfo {
  int64 id = 1;
  int64 manuscript_id = 2;
  int64 user_id = 3;
  string user_name = 4;
  string user_avatar = 5;
  int32 user_level = 6;
  string content = 7;
  int32 like_count = 8;
  int32 reply_count = 9;
  string created_at = 10;
  bool liked = 11;
  repeated ReplyInfo replies = 12;
}

message ReplyInfo {
  int64 id = 1;
  int64 comment_id = 2;
  int64 user_id = 3;
  string user_name = 4;
  string user_avatar = 5;
  int32 user_level = 6;
  string content = 7;
  int32 like_count = 8;
  string created_at = 9;
  string reply_to_user_name = 10;
  bool liked = 11;
}

message AddCommentRequest {
  int64 manuscript_id = 1;
  int64 user_id = 2;
  string content = 3;
}

message AddCommentResponse {
  CommentInfo comment = 1;
}

message ListCommentsRequest {
  int64 manuscript_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string sort = 4;
  int64 user_id = 5;
}

message ListCommentsResponse {
  repeated CommentInfo comments = 1;
}

message DeleteCommentRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message DeleteCommentResponse {}

message AddReplyRequest {
  int64 comment_id = 1;
  int64 user_id = 2;
  string content = 3;
  int64 reply_to_user_id = 4;
}

message AddReplyResponse {
  ReplyInfo reply = 1;
}

message GetRepliesRequest {
  int64 comment_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 user_id = 4;
}

message GetRepliesResponse {
  repeated ReplyInfo replies = 1;
}

message DeleteReplyRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message DeleteReplyResponse {}

message LikeCommentRequest {
  int64 comment_id = 1;
  int64 user_id = 2;
}

message LikeCommentResponse {}

message UnlikeCommentRequest {
  int64 comment_id = 1;
  int64 user_id = 2;
}

message UnlikeCommentResponse {}

message LikeReplyRequest {
  int64 reply_id = 1;
  int64 user_id = 2;
}

message LikeReplyResponse {}

message UnlikeReplyRequest {
  int64 reply_id = 1;
  int64 user_id = 2;
}

message UnlikeReplyResponse {}