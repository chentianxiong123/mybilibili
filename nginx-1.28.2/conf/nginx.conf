
#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/x-javascript image/svg+xml;
    gzip_comp_level 6;

    # 上传文件大小限制
    client_max_body_size 4096M;

    server {
        listen       80;
        server_name  localhost;

        # ==================== 用户前端 ====================
        location / {
            root   d:/files/mybilibili/mybilibili-web/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ==================== 管理员前端 ====================
        location /admin/ {
            alias d:/files/mybilibili/mybilibili-admin-web/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # ==================== 静态资源 ====================
        location /covers/ {
            alias d:/files/mybilibili/uploads/covers/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /videos/ {
            alias d:/files/mybilibili/uploads/videos/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ==================== 用户API代理 ====================
        location /api/ {
            proxy_pass http://localhost:7071/web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时配置（用于大文件上传）
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # ==================== 管理员API代理 ====================
        location /admin-api/ {
            proxy_pass http://localhost:7070/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
