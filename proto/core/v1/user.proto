syntax = "proto3";

package core.v1;

option go_package = "mybilibili/internal/core/pb";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
}

message RegisterResponse {
  int64 user_id = 1;
  string token = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 user_id = 2;
  string nickname = 3;
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserResponse {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string avatar = 5;
  int32 level = 6;
  string created_at = 7;
}